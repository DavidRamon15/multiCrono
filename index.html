<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Multicrono — control de horas</title>
<meta name="description" content="Varios cronómetros con nombre para controlar el tiempo dedicado a cada proyecto.">
<meta name="theme-color" content="#15120f">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,340;0,9..144,600;1,9..144,500&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css?v=8">
</head>
<body>

<div class="grain" aria-hidden="true"></div>

<header class="hero">
  <div class="hero-plate">
    <div class="hero-mark" aria-hidden="true">
      <svg viewBox="0 0 48 48" width="34" height="34">
        <circle cx="24" cy="26" r="17" fill="none" stroke="currentColor" stroke-width="3"/>
        <line x1="24" y1="26" x2="24" y2="15" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
        <line x1="24" y1="26" x2="31" y2="30" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
        <rect x="19" y="4" width="10" height="5" rx="2" fill="currentColor"/>
        <line x1="35" y1="9" x2="38" y2="6" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
      </svg>
    </div>
    <div class="hero-text">
      <h1>Multicrono</h1>
      <p class="hero-sub">control de horas por proyecto</p>
    </div>
    <div class="hero-total" id="grand-total">
      <span class="hero-total-label">hoy</span>
      <span class="hero-total-value" id="grand-total-value">00:00:00</span>
    </div>
  </div>
</header>

<main class="wrap">

  <form class="add-row" id="add-form" autocomplete="off">
    <input type="text" id="project-name" placeholder="Nombre del proyecto…" maxlength="40" required>
    <button type="submit" class="btn btn-add">
      <span>Añadir</span>
      <svg viewBox="0 0 20 20" width="16" height="16" aria-hidden="true"><path d="M10 3v14M3 10h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    </button>
  </form>

  <section id="empty-state" class="empty-state" hidden>
    <p>Todavía no tienes proyectos.</p>
    <p class="empty-sub">Añade uno arriba y dale al play para empezar a contar.</p>
  </section>

  <div class="toolbar-row">
    <button class="cal-open-btn" id="cal-open-btn" type="button">
      <svg viewBox="0 0 20 20" width="14" height="14" aria-hidden="true"><rect x="3.5" y="4.5" width="13" height="12" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M3.5 8h13M7 3v3M13 3v3" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
      <span class="cal-open-label">Ver calendario</span>
      <svg class="cal-open-chevron" viewBox="0 0 20 20" width="12" height="12" aria-hidden="true"><path d="M5 7.5l5 5 5-5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>

    <div class="backup-actions">
      <button class="ghost-btn" id="export-btn" type="button" title="Descargar una copia de seguridad de todos tus datos">
        <svg viewBox="0 0 20 20" width="13" height="13" aria-hidden="true"><path d="M10 3v10m0 0l-3.5-3.5M10 13l3.5-3.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M4 15.5v1a1.5 1.5 0 0 0 1.5 1.5h9a1.5 1.5 0 0 0 1.5-1.5v-1" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        <span>Copia de seguridad</span>
      </button>
      <button class="ghost-btn" id="import-btn" type="button" title="Restaurar proyectos desde una copia de seguridad">
        <svg viewBox="0 0 20 20" width="13" height="13" aria-hidden="true"><path d="M10 13V3m0 0L6.5 6.5M10 3l3.5 3.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M4 15.5v1a1.5 1.5 0 0 0 1.5 1.5h9a1.5 1.5 0 0 0 1.5-1.5v-1" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        <span>Restaurar</span>
      </button>
      <input type="file" id="import-file-input" accept="application/json,.json" hidden>
    </div>
  </div>

  <section class="calendar-section" id="calendar-section" hidden>
    <div class="cal-head">
      <button class="cal-nav" id="cal-prev" type="button" aria-label="Mes anterior">
        <svg viewBox="0 0 20 20" width="14" height="14"><path d="M12.5 4.5l-6 5.5 6 5.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <span class="cal-title" id="cal-title">—</span>
      <button class="cal-nav" id="cal-next" type="button" aria-label="Mes siguiente">
        <svg viewBox="0 0 20 20" width="14" height="14"><path d="M7.5 4.5l6 5.5-6 5.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>

    <div class="cal-weekdays">
      <span>L</span><span>M</span><span>X</span><span>J</span><span>V</span><span>S</span><span>D</span>
    </div>

    <div class="cal-grid" id="cal-grid"></div>

    <div class="cal-detail" id="cal-detail">
      <h3 class="cal-detail-date" id="cal-detail-date">—</h3>
      <div class="cal-detail-list" id="cal-detail-list"></div>
      <div class="cal-detail-empty" id="cal-detail-empty" hidden>Sin registros este día.</div>
      <div class="cal-detail-total" id="cal-detail-total"></div>
    </div>
  </section>

  <section class="grid" id="timer-grid" aria-live="polite"></section>

  <section class="summary" id="summary-section" hidden>
    <h2>Resumen</h2>
    <div class="summary-list" id="summary-list"></div>
  </section>

</main>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<template id="card-template">
  <article class="card" data-id="">
    <header class="card-head">
      <span class="dot" aria-hidden="true"></span>
      <h3 class="card-name" tabindex="0" role="button" title="Haz clic para renombrar"></h3>
      <button class="icon-btn delete-btn" type="button" aria-label="Eliminar proyecto">
        <svg viewBox="0 0 20 20" width="15" height="15"><path d="M4 6h12M8 6V4.5A1.5 1.5 0 0 1 9.5 3h1A1.5 1.5 0 0 1 12 4.5V6M6 6l.6 10.2A1.5 1.5 0 0 0 8.1 17.6h3.8a1.5 1.5 0 0 0 1.5-1.4L14 6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>
      </button>
    </header>

    <div class="display">
      <span class="digits">00:00:00</span>
    </div>

    <div class="stats">
      <div class="stat">
        <span class="stat-label">hoy</span>
        <span class="stat-value stat-today">00:00:00</span>
      </div>
      <div class="stat">
        <span class="stat-label">total</span>
        <span class="stat-value stat-total">00:00:00</span>
      </div>
    </div>

    <div class="controls">
      <button class="btn btn-toggle" type="button">
        <svg class="icon-play" viewBox="0 0 20 20" width="14" height="14"><path d="M6 4l10 6-10 6V4z" fill="currentColor"/></svg>
        <svg class="icon-pause" viewBox="0 0 20 20" width="14" height="14" hidden><path d="M6 4h3v12H6zM11 4h3v12h-3z" fill="currentColor"/></svg>
        <span class="toggle-label">Iniciar</span>
      </button>
      <button class="btn btn-reset" type="button">Reiniciar</button>
    </div>

    <div class="notes">
      <button class="notes-toggle" type="button">
        <svg viewBox="0 0 20 20" width="13" height="13" aria-hidden="true"><path d="M5 3h10a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1z" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M6.5 7h7M6.5 10h7M6.5 13h4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
        <span>Parte</span>
        <span class="notes-count">0</span>
        <svg class="notes-chevron" viewBox="0 0 20 20" width="11" height="11" aria-hidden="true"><path d="M5 7.5l5 5 5-5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>

      <div class="notes-panel" hidden>
        <form class="notes-form">
          <input type="text" class="notes-input" placeholder="ej. tarea 123 completada…" maxlength="200" autocomplete="off">
          <button type="submit" class="icon-btn note-add-btn" aria-label="Añadir nota">
            <svg viewBox="0 0 20 20" width="15" height="15"><path d="M10 3v14M3 10h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          </button>
        </form>
        <ul class="notes-list"></ul>
      </div>
    </div>

    <div class="days">
      <button class="days-toggle" type="button">
        <svg viewBox="0 0 20 20" width="13" height="13" aria-hidden="true"><rect x="3.5" y="4.5" width="13" height="12" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M3.5 8h13M7 3v3M13 3v3" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
        <span>Días</span>
        <span class="days-count">0</span>
        <svg class="days-chevron" viewBox="0 0 20 20" width="11" height="11" aria-hidden="true"><path d="M5 7.5l5 5 5-5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>

      <div class="days-panel" hidden>
        <ul class="days-list"></ul>
      </div>
    </div>
  </article>
</template>

<template id="day-template">
  <li class="day-item" data-date="">
    <span class="day-date"></span>
    <span class="day-value"></span>
  </li>
</template>

<template id="note-template">
  <li class="note-item" data-id="">
    <div class="note-body">
      <div class="note-meta">
        <span class="note-time"></span>
        <span class="note-elapsed"></span>
      </div>
      <span class="note-text"></span>
    </div>
    <button class="note-delete" type="button" aria-label="Eliminar nota">
      <svg viewBox="0 0 20 20" width="11" height="11"><path d="M4 4l12 12M16 4L4 16" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
    </button>
  </li>
</template>

<script src="app.js?v=8"></script>
</body>
</html>
